services:
  player:
    build: .
    restart: unless-stopped
    environment:
      BIND_HOST: 0.0.0.0
      PORT: 8080
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080'
    volumes:
      - ./build:/app/build:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
